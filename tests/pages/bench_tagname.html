<!DOCTYPE html>
<html><head><title>Bench</title>
<style>body { margin: 10px; font-size: 24px }</style>
</head><body>
<!-- tarea 41d: lo que cuestan tagName y nodeName (jQuery y compañía los leen sin parar): 20000 lecturas de cada uno
     sobre 50 elementos; el resultado en la página y en el título -->
<p id=r>midiendo...</p>
<div id=c></div>
<script>
var c = document.getElementById('c'), els = [];
for (var i = 0; i < 50; i++) { var d = document.createElement(i % 2 ? 'span' : 'div'); c.appendChild(d); els.push(d); }
function medir(f) { var t = Date.now(); f(); return Date.now() - t; }
var n = 0;
var r1 = medir(function () { for (var i = 0; i < 20000; i++) n += els[i % 50].tagName.length; });
var r2 = medir(function () { for (var i = 0; i < 20000; i++) n += els[i % 50].nodeName.length; });
var s = 'tagName ' + r1 + ' nodeName ' + r2 + ' (' + n + ')';
document.getElementById('r').textContent = s;
document.title = s;
</script>
</body></html>
